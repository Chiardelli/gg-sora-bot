name: Resumo semanal

on:
  schedule:
    # toda segunda-feira às 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions" do GitHub

permissions:
  contents: write # necessário pra commitar o state/seen.json zerado

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar dados privados do cache (grupos + state)
        uses: actions/cache/restore@v4
        with:
          path: |
            config/groups_bot.yaml
            state/seen.json
          key: sora-dados-privados-${{ github.run_id }}
          restore-keys: |
            sora-dados-privados-

      - name: Enviar resumo semanal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/weekly_digest.py

      - name: Salvar dados privados atualizados no cache
        uses: actions/cache/save@v4
        with:
          path: |
            config/groups_bot.yaml
            state/seen.json
          key: sora-dados-privados-${{ github.run_id }}

      # FASE 1 da migração pra cache privado: commit antigo mantido por
      # enquanto até confirmar que o cache está semeado. Remover depois.
      - name: Commitar estado atualizado
        run: |
          git config user.name "gg-heartbeat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "chore: reseta contagem do resumo semanal [skip ci]"
          git push
