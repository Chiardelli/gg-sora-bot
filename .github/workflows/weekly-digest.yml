name: Resumo semanal

on:
  schedule:
    # toda segunda-feira às 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions" do GitHub

permissions:
  contents: write # necessário pra commitar o state/seen.json zerado

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Enviar resumo semanal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/weekly_digest.py

      - name: Commitar estado atualizado
        run: |
          git config user.name "gg-heartbeat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "chore: reseta contagem do resumo semanal [skip ci]"
          git push
