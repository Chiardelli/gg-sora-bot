name: Comando do Telegram (instantâneo)

on:
  repository_dispatch:
    types: [telegram-command]

permissions:
  contents: write # necessário pra commitar config/groups_bot.yaml atualizado

concurrency:
  group: telegram-webhook
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar dados privados do cache (grupos + state)
        uses: actions/cache/restore@v4
        with:
          path: |
            config/groups_bot.yaml
            state/seen.json
          key: sora-dados-privados-${{ github.run_id }}
          restore-keys: |
            sora-dados-privados-

      - name: Processar o comando
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_UPDATE_JSON: ${{ toJson(github.event.client_payload) }}
        run: python src/process_webhook_update.py

      - name: Salvar dados privados atualizados no cache
        uses: actions/cache/save@v4
        with:
          path: |
            config/groups_bot.yaml
            state/seen.json
          key: sora-dados-privados-${{ github.run_id }}

      # FASE 1 da migração pra cache privado: commit antigo mantido por
      # enquanto até confirmar que o cache está semeado. Remover depois.
      - name: Commitar grupos atualizados
        run: |
          git config user.name "gg-heartbeat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/groups_bot.yaml
          git diff --cached --quiet || git commit -m "chore: atualiza grupos via comando do Telegram [skip ci]"
          git push
